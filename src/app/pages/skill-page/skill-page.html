<!--

@description: Template for the `app-skill-page` component
================================================================================
!-->

<div class="page-container">
  <div class="section-container">
    <div class="section-header">
      <i class="pi pi-code section-icon"></i>
      <span class="section-subtitle">Programming Languages</span>
    </div>

    <div class="skill-cards-grid">
      @for (card of languages; track card.name) {
        <app-skill-card
          [name]="card.name"
          [icon]="card.icon">
        </app-skill-card>
      }
    </div>
  </div>

  <div class="section-container">
    <div class="section-header">
      <i class="pi pi-warehouse section-icon"></i>
      <span class="section-subtitle">Frameworks</span>
    </div>

    <div class="skill-cards-grid">
      @for (card of frameworks; track card.name) {
        <app-skill-card
          [name]="card.name"
          [icon]="card.icon">
        </app-skill-card>
      }
    </div>
  </div>

  <div class="section-container">
    <div class="section-header">
      <i class="pi pi-hammer section-icon"></i>
      <span class="section-subtitle">Tools</span>
    </div>

    <div class="skill-cards-grid">
      @for (card of tools; track card.name) {
        <app-skill-card
          [name]="card.name"
          [icon]="card.icon">
        </app-skill-card>
      }
    </div>
  </div>

  <div class="section-container">
    <div class="section-header">
      <i class="pi pi-database section-icon"></i>
      <span class="section-subtitle">Data</span>
    </div>

    <div class="skill-cards-grid">
      @for (card of data; track card.name) {
        <app-skill-card
          [name]="card.name"
          [icon]="card.icon">
        </app-skill-card>
      }
    </div>
  </div>

  <div class="section-container">
    <div class="section-header">
      <i class="pi pi-microsoft section-icon"></i>
      <span class="section-subtitle">Operating Systems</span>
    </div>

    <div class="skill-cards-grid">
      @for (card of operatingSystems; track card.name) {
        <app-skill-card
          [name]="card.name"
          [icon]="card.icon">
        </app-skill-card>
      }
    </div>
  </div>
</div>
