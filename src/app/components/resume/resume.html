<!--
================================================================================
@description: Template for the `app-resume` component
================================================================================
!-->

<div
	*ngIf="isLoading"
	class="spinner-container-fullscreen">
	<p-progress-spinner ariaLabel="loading" />
</div>
<div class="download-btn">
	<p-button
		label="Download"
		icon="pi pi-download"
		[disabled]="isLoading"
		(click)=onDownloadBtnClick()>
	</p-button>
</div>
<div
	*ngIf="!isLoading && pdfSrc"
	class="resume-container">
	<pdf-viewer
		[src]="pdfSrc"
		[render-text]="true"
		[original-size]="false"
		style="width: 100%; height: 90vh; display: block;">
	</pdf-viewer>
</div>
